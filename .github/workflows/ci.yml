name: CI

on:
  pull_request:
  push:
    branches: [main, build]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the web app
        env:
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
          NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3211
          DATABASE_URL: postgres://moj:moj@127.0.0.1:5432/moj_auth
          BETTER_AUTH_SECRET: ci-build-only-not-a-real-secret
          BETTER_AUTH_URL: http://localhost:3000
          AUTH_ISSUER: http://localhost:3000
          AUTH_RP_ID: localhost
          SITE_NAME: MOJ
          SITE_LONG_NAME: the MAPS Online Judge
        run: npm run build -w apps/web

  judge:
    name: Judge image and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: docker/setup-buildx-action@v3

      - name: Build the tier 1 judge image
        uses: docker/build-push-action@v6
        with:
          context: apps/judge
          file: apps/judge/Dockerfile
          build-args: |
            TIER=tier1
          tags: moj-judge:tier1
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Judge end-to-end against the mock site
        env:
          MOJ_JUDGE_IMAGE: moj-judge:tier1
        run: python3 apps/judge/tests/e2e.py

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    needs: check
    if: vars.RUN_E2E == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Bring up the development stack
        run: |
          docker compose -f infra/compose.dev.yml up -d
          docker compose -f infra/compose.dev.yml ps

      - name: Set up the site
        run: npm run setup

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run Playwright
        run: npx playwright test
        working-directory: apps/web

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f infra/compose.dev.yml logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f infra/compose.dev.yml down -v
