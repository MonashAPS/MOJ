name: CI

on:
  pull_request:
  push:
    branches: [main, build]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `prepare` builds packages/content, which everything else typechecks
      # against, so this has to run with its scripts.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The NEXT_PUBLIC_* values are inlined into the client bundle, so a build
      # needs them even when nothing is running behind them.
      - name: Build
        env:
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
          NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3211
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          DATABASE_URL: postgresql://moj:moj@127.0.0.1:5433/moj_auth
          AUTH_SECRET: ci-build-only-not-a-real-secret
          AUTH_ISSUER: http://localhost:3000
          AUTH_RP_ID: localhost
        run: npm run build

  web-image:
    name: Web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          tags: moj-web:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image starts and answers its healthcheck
        run: |
          docker run -d --name moj-web-ci -p 3000:3000 \
            -e NEXT_PUBLIC_CONVEX_URL=http://127.0.0.1:3210 \
            -e NEXT_PUBLIC_CONVEX_SITE_URL=http://127.0.0.1:3211 \
            -e NEXT_PUBLIC_APP_URL=http://localhost:3000 \
            -e DATABASE_URL=postgresql://moj:moj@127.0.0.1:5433/moj_auth \
            -e AUTH_SECRET=ci-run-only-not-a-real-secret \
            moj-web:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo
              docker rm -f moj-web-ci
              exit 0
            fi
            sleep 2
          done
          docker logs moj-web-ci
          docker rm -f moj-web-ci
          exit 1

  judge:
    name: Judge image and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: docker/setup-buildx-action@v4

      - name: Build the tier 1 judge image
        uses: docker/build-push-action@v7
        with:
          context: apps/judge
          file: apps/judge/Dockerfile
          build-args: |
            TIER=tier1
          tags: moj-judge:tier1
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Judge end-to-end against the mock site
        run: python3 apps/judge/tests/e2e.py --image moj-judge:tier1

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    needs: check
    if: vars.RUN_E2E == 'true'
    env:
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3211
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://moj:moj@127.0.0.1:5433/moj_auth
      AUTH_ISSUER: http://localhost:3000
      AUTH_RP_ID: localhost
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      # The compose file's paths are relative to the repository root, so it is
      # run from there with `--project-directory .`, exactly as setup does.
      - name: Bring up the development stack
        run: |
          docker compose -f infra/compose.dev.yml --project-directory . up -d
          docker compose -f infra/compose.dev.yml --project-directory . ps

      # Writes .env.local, migrates the auth database, pushes the Convex
      # functions, seeds, and creates the development superuser.
      - name: Set up the site
        run: npm run setup

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run Playwright
        run: npx playwright test
        working-directory: apps/web

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f infra/compose.dev.yml --project-directory . logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f infra/compose.dev.yml --project-directory . down -v
