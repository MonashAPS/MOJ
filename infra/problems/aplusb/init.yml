# A plus B: the smoke-test problem for a MOJ deployment.
#
# Two batches: the sample cases from the statement, worth nothing, and the real tests, worth everything.
# Within a batch a single failing case scores the whole batch zero, which is DMOJ's batch semantics.
test_cases:
- batched:
  - {in: tests/sample.1.in, out: tests/sample.1.out}
  - {in: tests/sample.2.in, out: tests/sample.2.out}
  points: 0
- batched:
  - {in: tests/main.1.in, out: tests/main.1.out}
  - {in: tests/main.2.in, out: tests/main.2.out}
  - {in: tests/main.3.in, out: tests/main.3.out}
  - {in: tests/main.4.in, out: tests/main.4.out}
  points: 100
